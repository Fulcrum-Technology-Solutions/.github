name: Node npm Dependency Audit (Reusable)

# Flags known-vulnerable dependencies. Supports a subdirectory via
# working-directory input. Consuming repo sets cadence (PR + weekly) in caller.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      audit-level:
        type: string
        default: "high"
      working-directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Read optional npm declaration
        id: toolchain
        working-directory: ${{ inputs.working-directory }}
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re

          manager = json.loads(pathlib.Path("package.json").read_text()).get("packageManager")
          # Existing callers without a declaration retain bundled npm.
          if manager is not None:
              match = re.fullmatch(r"npm@([0-9]+\.[0-9]+\.[0-9]+)", manager)
              if not match:
                  raise SystemExit("packageManager must be an exact npm@major.minor.patch")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"npm-version={match[1]}\n")
      - name: Install declared npm version
        if: steps.toolchain.outputs.npm-version != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          NPM_VERSION: ${{ steps.toolchain.outputs.npm-version }}
        run: |
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Audit lockfile dependencies
        shell: bash
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          case "$AUDIT_LEVEL" in
            info|low|moderate|high|critical|none) ;;
            *) echo "::error::audit-level must be info, low, moderate, high, critical, or none"; exit 1 ;;
          esac
          npm audit --audit-level="$AUDIT_LEVEL"
        working-directory: ${{ inputs.working-directory }}
