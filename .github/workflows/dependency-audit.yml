name: Node npm Dependency Audit (Reusable)

# Flags known-vulnerable dependencies. Supports a subdirectory via
# working-directory input. Consuming repo sets cadence (PR + weekly) in caller.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      audit-level:
        type: string
        default: "high"
      working-directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Audit lockfile dependencies
        shell: bash
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          case "$AUDIT_LEVEL" in
            info|low|moderate|high|critical|none) ;;
            *) echo "::error::audit-level must be info, low, moderate, high, critical, or none"; exit 1 ;;
          esac
          npm audit --audit-level="$AUDIT_LEVEL"
        working-directory: ${{ inputs.working-directory }}
