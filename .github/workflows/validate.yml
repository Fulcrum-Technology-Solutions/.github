name: Validate Shared Workflows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install -r tests/requirements.txt semgrep==1.177.0
      - name: Test profile selection and failure handling
        run: python -m unittest discover -s tests -v
      - name: Install workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows and examples
        run: |
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes= docs/examples/*.yml.example
