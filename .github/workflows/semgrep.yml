name: Semgrep SAST (Reusable)

on:
  workflow_call:
    inputs:
      profile:
        description: "general, javascript, ia, or legacy-ia (compatibility default)"
        type: string
        default: legacy-ia
      working-directory:
        description: "Directory inside the caller repository to scan"
        type: string
        default: "."

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep==1.177.0
      - name: Run profile checks
        shell: python
        env:
          SCAN_PROFILE: ${{ inputs.profile }}
          SCAN_DIRECTORY: ${{ inputs.working-directory }}
        # Inline implementation belongs to the called workflow revision. This
        # avoids loading executable helpers from an untrusted caller checkout.
        run: |
          import os
          import pathlib
          import subprocess
          import tempfile

          profile = os.environ["SCAN_PROFILE"]
          profiles = {
              "general": ["p/default", "p/secrets"],
              "javascript": ["p/default", "p/secrets", "p/typescript", "p/react"],
              "ia": ["p/default", "p/secrets", "p/typescript", "p/react"],
              "legacy-ia": ["p/default", "p/secrets", "p/typescript", "p/react"],
          }
          if profile not in profiles:
              raise SystemExit("Unknown Semgrep profile: " + profile)
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          target = (workspace / os.environ["SCAN_DIRECTORY"]).resolve()
          if not target.is_relative_to(workspace) or not target.is_dir():
              raise SystemExit("working-directory must be a directory within the repository")
          configs = list(profiles[profile])
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
              if profile in ("ia", "legacy-ia"):
                  # Canonical FTSC Supabase rule, kept here so callers do not
                  # need another checkout or token. No duplicate rules file.
                  rules = pathlib.Path(temporary) / "supabase.yml"
                  rules.write_text('''rules:
            - id: supabase-service-role-in-public-env
              languages: [generic]
              severity: ERROR
              message: >-
                Potential Supabase privileged key reference in a browser-public
                environment variable. Keep service_role and secret keys server-only.
              pattern-regex: '(NEXT_PUBLIC_|VITE_)[A-Z0-9_]*(SERVICE_ROLE|SERVICE_KEY)'
              paths:
                include: ['*.ts','*.tsx','*.js','*.jsx','*.env','*.env.*']
          ''')
                  configs.append(str(rules))
              command = ["semgrep", "scan", "--error", "--strict", "--metrics=off"]
              for config in configs:
                  command.extend(["--config", config])
              command.append(".")
              subprocess.run(command, cwd=target, check=True)
